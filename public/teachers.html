<!DOCTYPE html>
<html>
<head>
    <title>Teacher Leave Application</title>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        .form-container {
            max-width: 400px;
            margin: auto;
        }

        label {
            display: block;
            margin: 10px 0 5px;
        }

        input, select, button {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

            button:hover {
                background: #45a049;
            }
    </style>
</head>

<body>

    <h2>Teacher Leave Application</h2>

    <div class="form-container">

        <label>Teacher Name:</label>
        <input type="text" id="teacherName" readonly>

        <label>Designation:</label>
        <input type="text" id="designation" readonly>

        <label>Start Date:</label>
        <input type="date" id="startDate">

        <label>End Date:</label>
        <input type="date" id="endDate">

        <label>Reason:</label>
        <select id="reason">
            <option value="Fever">I am suffering from fever</option>
            <option value="Cold">I am suffering from cold</option>
            <option value="Family Ritual">I need to attend a family ritual</option>
            <option value="Native Place">I need to go to my native place</option>
        </select>

        <label>Total Days:</label>
        <input type="text" id="totalDays" readonly>

        <button onclick="generatePDF()">Generate Leave Letter</button>

        <button onclick="saveToFirestore()">Save Leave Request</button>

    </div>


    <script type="module">

        // ==========================================
        // FIREBASE IMPORTS
        // ==========================================

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        import {
            getFirestore,
            collection,
            addDoc
        }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


        // ==========================================
        // FIREBASE CONFIGURATION
        // ==========================================

        const firebaseConfig = {

            apiKey: "AIzaSyC_62TIZPMqqau9HbVNXtU0vl0hx7KKwzs",

            authDomain: "jagadishguruji-e3740.firebaseapp.com",

            projectId: "jagadishguruji-e3740",

            storageBucket: "jagadishguruji-e3740.firebasestorage.app",

            messagingSenderId: "42042944668",

            appId: "1:42042944668:web:98c0ce8c215d29a8d49159",

            measurementId: "G-QZYFS2JSP2"

        };


        // ==========================================
        // INITIALIZE FIREBASE
        // ==========================================

        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);


        // ==========================================
        // GET TEACHER INFORMATION
        // ==========================================

        const teacherName =
            localStorage.getItem("teacherName");

        const designation =
            localStorage.getItem("designation");


        document.getElementById("teacherName").value =
            teacherName || "";

        document.getElementById("designation").value =
            designation || "";


        // ==========================================
        // CALCULATE TOTAL DAYS
        // ==========================================

        document.getElementById("startDate")
            .addEventListener("change", calcDays);

        document.getElementById("endDate")
            .addEventListener("change", calcDays);


        function calcDays() {

            const startValue =
                document.getElementById("startDate").value;

            const endValue =
                document.getElementById("endDate").value;


            if (!startValue || !endValue) {

                document.getElementById("totalDays").value = "";

                return;
            }


            const start =
                new Date(startValue);

            const end =
                new Date(endValue);


            if (end >= start) {

                const diff =
                    Math.floor(
                        (end - start) /
                        (1000 * 60 * 60 * 24)
                    ) + 1;

                document.getElementById("totalDays").value =
                    diff;

            } else {

                document.getElementById("totalDays").value = "";

            }
        }


        // ==========================================
        // GENERATE PDF
        // ==========================================

        window.generatePDF = function () {

            const { jsPDF } = window.jspdf;

            const pdf = new jsPDF();


            const today =
                new Date().toLocaleDateString();

            const teacherName =
                document.getElementById("teacherName").value;

            const designation =
                document.getElementById("designation").value;

            const startDate =
                document.getElementById("startDate").value;

            const endDate =
                document.getElementById("endDate").value;

            const reason =
                document.getElementById("reason").value;

            const totalDays =
                document.getElementById("totalDays").value;


            pdf.text(
                `Date: ${today}`,
                150,
                10
            );


            pdf.text(
                "To,\nThe Headmaster,\nOur School",
                20,
                30
            );


            pdf.text(
                "Respected Sir/Madam,",
                20,
                60
            );


            pdf.text(
                `I, ${teacherName}, (${designation}), request leave from ${startDate} to ${endDate} (${totalDays} days) due to ${reason}.`,
                20,
                80
            );


            pdf.text(
                "Kindly grant me leave for the above-mentioned period.",
                20,
                100
            );


            pdf.text(
                `Thanking you,\n\nYours faithfully,\n${teacherName}`,
                20,
                130
            );


            pdf.save(
                "Leave_Application.pdf"
            );

        };


        // ==========================================
        // SAVE LEAVE REQUEST TO FIRESTORE
        // ==========================================

        window.saveToFirestore = async function () {

            try {

                await addDoc(
                    collection(db, "leave_requests"),
                    {

                        name:
                            document.getElementById("teacherName").value,

                        designation:
                            document.getElementById("designation").value,

                        startDate:
                            document.getElementById("startDate").value,

                        endDate:
                            document.getElementById("endDate").value,

                        reason:
                            document.getElementById("reason").value,

                        totalDays:
                            document.getElementById("totalDays").value,

                        timestamp:
                            new Date()

                    }
                );


                alert(
                    "Leave request saved!"
                );


            } catch (error) {

                console.error(
                    "Error saving leave:",
                    error
                );

                alert(
                    "Failed to save leave request: " +
                    error.message
                );

            }

        };

    </script>

</body>
</html>
